name: Monitor Render Server

permissions:
  contents: none

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render health
        run: |
          curl -s --max-time 90 https://rc-backend-maqi.onrender.com/health > /dev/null || true
